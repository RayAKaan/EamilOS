name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not tag/push)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: '$VERSION' is not a valid semver version"; exit 1
          fi
          PKG=$(node -p "require('./packages/cli/package.json').version")
          echo "current package version: $PKG"
          echo "requested release version: $VERSION"
          if [ "$VERSION" != "$PKG" ]; then
            echo "NOTE: package.json ($PKG) does not match requested version ($VERSION);"
            echo "      the bump step will set it to $VERSION."
          fi
          if npm view "@eamilos/cli@$VERSION" version >/dev/null 2>&1; then
            echo "ERROR: $VERSION is already published on npm — refusing to re-release."; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/cli

      - name: Run tests
        run: npm test
        working-directory: packages/cli

      - name: Build
        run: npm run build
        working-directory: packages/cli

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/cli

      - name: Update version
        if: ${{ !inputs.dry_run }}
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version
          npm version ${{ inputs.version }} --no-git-tag-version -w @eamilos/cli

      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/cli/package.json package-lock.json
          git commit -m "chore: release v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output summary
        run: |
          echo "## Release Preparation Complete"
          echo ""
          echo "Version: ${{ inputs.version }}"
          echo "Dry run: ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo ""
            echo "⚠️ This was a dry run. No tags or releases were created."
            echo "Run again with \`dry_run: false\` to create the release."
          fi
